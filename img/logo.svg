<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 524" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Logotipo Estación Federico Lacroze">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3252"/>
      <stop offset="100%" stop-color="#0D1B2C"/>
    </linearGradient>
    <radialGradient id="hl" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFDE8"/>
      <stop offset="38%"  stop-color="#F4C040"/>
      <stop offset="78%"  stop-color="#D09010"/>
      <stop offset="100%" stop-color="#9A6800"/>
    </radialGradient>
    <linearGradient id="ws" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%"   stop-color="#080F1C"/>
      <stop offset="100%" stop-color="#121E30"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F2EDE2"/>
      <stop offset="100%" stop-color="#E0DAD0"/>
    </linearGradient>
    <linearGradient id="bump" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#9AAAB4"/>
      <stop offset="100%" stop-color="#68787E"/>
    </linearGradient>
    <clipPath id="wsClip">
      <rect x="86" y="88" width="228" height="112" rx="14"/>
    </clipPath>
    <clipPath id="cabClip">
      <rect x="66" y="56" width="268" height="265" rx="28"/>
    </clipPath>
  </defs>

  <!-- Badge -->
  <rect x="8"  y="12" width="392" height="510" rx="50" fill="#000" opacity="0.5"/>
  <rect x="4"  y="4"  width="392" height="512" rx="48" fill="url(#bg)"/>
  <rect x="4"  y="4"  width="392" height="512" rx="48" fill="none" stroke="#B87A0C" stroke-width="2.5" opacity="0.8"/>
  <rect x="11" y="11" width="378" height="498" rx="43" fill="none" stroke="#E8A820" stroke-width="0.8" opacity="0.22"/>

  <!-- Cab -->
  <rect x="70" y="61" width="268" height="265" rx="28" fill="#000" opacity="0.32"/>
  <rect x="66" y="56" width="268" height="265" rx="28" fill="url(#cab)"/>
  <rect x="66" y="208" width="268" height="1.5" fill="#C5C0B5" opacity="0.55" clip-path="url(#cabClip)"/>

  <!-- Destination board -->
  <rect x="90" y="65" width="220" height="21" rx="7" fill="#C88A0E"/>
  <rect x="90" y="65" width="220" height="21" rx="7" fill="none" stroke="#9A6A00" stroke-width="0.8" opacity="0.6"/>
  <text x="200" y="80" text-anchor="middle" fill="#1A2940"
        font-family="'Arial Narrow','Arial',sans-serif"
        font-size="9.5" font-weight="700" letter-spacing="5">LACROZE</text>

  <!-- Windshield -->
  <rect x="86" y="88" width="228" height="112" rx="14" fill="url(#ws)"/>
  <g clip-path="url(#wsClip)" opacity="0.065">
    <polygon points="92,84 146,88 120,204 84,200" fill="white"/>
    <polygon points="149,88 176,88 152,204 122,204" fill="white" opacity="0.6"/>
  </g>
  <rect x="196.5" y="90" width="7" height="108" fill="#060E18" opacity="0.4"/>

  <!-- Livery stripe -->
  <rect x="66" y="242" width="268" height="27" fill="#E8A820"/>
  <line x1="66" y1="252.5" x2="334" y2="252.5" stroke="#C88A0E" stroke-width="1.5" opacity="0.45"/>

  <!-- Left headlight -->
  <circle cx="108" cy="293" r="31" fill="#10192A"/>
  <circle cx="108" cy="293" r="25" fill="url(#hl)"/>
  <circle cx="108" cy="293" r="11" fill="#FFFEF2"/>
  <ellipse cx="102.5" cy="287" rx="4" ry="3" fill="white" opacity="0.65" transform="rotate(-18,102.5,287)"/>

  <!-- Right headlight -->
  <circle cx="292" cy="293" r="31" fill="#10192A"/>
  <circle cx="292" cy="293" r="25" fill="url(#hl)"/>
  <circle cx="292" cy="293" r="11" fill="#FFFEF2"/>
  <ellipse cx="286.5" cy="287" rx="4" ry="3" fill="white" opacity="0.65" transform="rotate(-18,286.5,287)"/>

  <!-- Center emblem -->
  <circle cx="200" cy="293" r="25" fill="#0D1B2C"/>
  <circle cx="200" cy="293" r="21" fill="none" stroke="#E8A820" stroke-width="1.8"/>
  <text x="200" y="297.5" text-anchor="middle" fill="#E8A820"
        font-family="'Century Gothic','Trebuchet MS',sans-serif"
        font-size="12" font-weight="700" letter-spacing="1">FL</text>

  <!-- Bumper -->
  <rect x="72"  y="322" width="256" height="15" rx="7.5" fill="url(#bump)"/>
  <rect x="82"  y="325.5" width="236" height="7" rx="3.5" fill="#A0ACB4" opacity="0.7"/>

  <!-- Coupling -->
  <rect x="183" y="336" width="34" height="14" rx="5" fill="#586068"/>
  <rect x="189" y="339" width="22" height="8"  rx="3" fill="#44505A"/>
  <circle cx="200" cy="343" r="3" fill="#38444C"/>

  <!-- Divider -->
  <line x1="44"  y1="374" x2="175" y2="374" stroke="#E8A820" stroke-width="1.5" opacity="0.28"/>
  <rect  x="194" y="368" width="12" height="12" fill="#E8A820" opacity="0.7" transform="rotate(45,200,374)"/>
  <line x1="225" y1="374" x2="356" y2="374" stroke="#E8A820" stroke-width="1.5" opacity="0.28"/>

  <!-- Text -->
  <text x="200" y="399" text-anchor="middle" fill="#E8A820"
        font-family="'Century Gothic','Trebuchet MS',sans-serif"
        font-size="10" letter-spacing="7" font-weight="400">ESTACIÓN</text>

  <text x="200" y="442" text-anchor="middle" fill="#EDE8DE"
        font-family="'Arial Narrow','Arial',sans-serif"
        font-size="48" letter-spacing="3" font-weight="700">LACROZE</text>

  <!-- Rail tracks -->
  <line x1="36" y1="458" x2="364" y2="458" stroke="#E8A820" stroke-width="1.5" opacity="0.16"/>
  <line x1="36" y1="466" x2="364" y2="466" stroke="#E8A820" stroke-width="1.5" opacity="0.16"/>
  <g stroke="#E8A820" stroke-width="2" opacity="0.1">
    <line x1="58"  y1="455" x2="58"  y2="470"/>
    <line x1="96"  y1="455" x2="96"  y2="470"/>
    <line x1="134" y1="455" x2="134" y2="470"/>
    <line x1="172" y1="455" x2="172" y2="470"/>
    <line x1="210" y1="455" x2="210" y2="470"/>
    <line x1="248" y1="455" x2="248" y2="470"/>
    <line x1="286" y1="455" x2="286" y2="470"/>
    <line x1="324" y1="455" x2="324" y2="470"/>
    <line x1="362" y1="455" x2="362" y2="470"/>
  </g>

  <text x="200" y="492" text-anchor="middle" fill="#E8A820"
        font-family="'Century Gothic','Trebuchet MS',sans-serif"
        font-size="8.5" letter-spacing="6" opacity="0.45">BUENOS AIRES</text>
</svg>
